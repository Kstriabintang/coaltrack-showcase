<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CoalTrack — Qubah Group</title>
<meta name="description" content="CoalTrack by Qubah Group: anti-fraud attendance for coal mining. Per-slide showcase in 5 languages. Laravel · Vue · Flutter.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="CoalTrack">
<meta property="og:title" content="CoalTrack — Coal Mine Attendance">
<meta property="og:description" content="Anti-fraud attendance + automatic payroll for coal mining operations. By Qubah Group.">
<meta property="og:image" content="https://ksatriabintangsamudra.my.id/coaltrack-showcase/img/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="https://ksatriabintangsamudra.my.id/coaltrack-showcase/">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="CoalTrack — Coal Mine Attendance">
<meta name="twitter:description" content="Anti-fraud attendance + payroll for coal mining. By Qubah Group.">
<meta name="twitter:image" content="https://ksatriabintangsamudra.my.id/coaltrack-showcase/img/og.png">
<meta name="theme-color" content="#3C8A12">
<link rel="icon" href="img/qubah-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+Arabic:wght@400;600;800&family=Noto+Sans+SC:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --green:#3C8A12; --green2:#2F7009; --green3:#6BBE33; --tint:#E7F5D6;
  --gold:#E6A200; --forest:#0E2E08; --forest2:#1E5E12;
  --bg:#F7F9F4; --card:#FFFFFF; --tx:#0F172A; --tx2:#4B5A55; --tx3:#8A9A90;
  --line:#E6ECE0;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --cjk:"Noto Sans SC",var(--sans);
  --arab:"Noto Sans Arabic",var(--sans);
}
*{box-sizing:border-box;margin:0}
html{scroll-snap-type:y mandatory;scroll-behavior:smooth}
body{font-family:var(--sans);background:var(--bg);color:var(--tx);-webkit-font-smoothing:antialiased;line-height:1.5;overflow-x:hidden}
html[lang="zh"] body{font-family:var(--cjk)}
html[lang="ar"] body{font-family:var(--arab)}
h1,h2,h3{line-height:1.1;letter-spacing:-.02em}
a{color:var(--green);text-decoration:none}
img{max-width:100%}

.slide{min-height:100svh;scroll-snap-align:start;display:flex;flex-direction:column;justify-content:center;
  padding:64px clamp(18px,4vw,48px) 56px;position:relative;border-bottom:1px solid var(--line)}
.slide.dark{background:linear-gradient(165deg,#071c05,#0E2E08 55%,#123f0b);color:#eaf6df;border-bottom-color:#123f0b}
.wrap{width:100%;max-width:1140px;margin:0 auto}
.eyebrow{display:inline-flex;align-items:center;gap:9px;font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--green)}
.eyebrow::before{content:"";width:24px;height:2px;background:var(--green);border-radius:2px}
.dark .eyebrow{color:#8fdc56}.dark .eyebrow::before{background:#8fdc56}
.slide h2{font-size:clamp(26px,4.2vw,42px);font-weight:800;margin:14px 0 8px;text-wrap:balance}
.dark h2{color:#fff}
.lead{font-size:clamp(15px,1.7vw,18px);color:var(--tx2);max-width:64ch}
.dark .lead{color:#bfe6a6}

.phones{display:flex;gap:clamp(16px,2.4vw,34px);justify-content:center;align-items:flex-start;flex-wrap:wrap;margin-top:clamp(20px,3vw,34px)}
.phone{width:clamp(150px,15vw,204px)}
.phone .frame{padding:6px;border-radius:36px;background:linear-gradient(155deg,#27313f,#0b1220);
  box-shadow:0 34px 60px -30px rgba(2,44,22,.5),inset 0 0 0 1px rgba(255,255,255,.06)}
.dark .phone .frame{box-shadow:0 34px 60px -26px rgba(0,0,0,.6),inset 0 0 0 1px rgba(255,255,255,.08)}
.phone .frame img{width:100%;display:block;border-radius:30px;aspect-ratio:412/892;object-fit:cover;background:#fff}
.phone .cap{text-align:center;margin-top:12px}
.phone .cap b{font-size:13.5px;font-weight:700;display:block}
.phone .cap span{font-size:12px;color:var(--tx3)}
.dark .phone .cap b{color:#fff}.dark .phone .cap span{color:#86c95f}
.paper{width:clamp(150px,15vw,210px);border-radius:8px;overflow:hidden;box-shadow:0 30px 60px -24px rgba(2,44,22,.45);border:1px solid var(--line)}

.cover{text-align:center;align-items:center}
.cover .logo{width:96px;height:96px;border-radius:26px;background:#fff;padding:12px;box-shadow:0 26px 50px -18px rgba(2,44,22,.4);margin:0 auto 22px}
.cover h1{font-size:clamp(38px,7vw,72px);font-weight:900;letter-spacing:-.03em}
.cover .by{margin-top:8px;font-size:14px;color:var(--tx3);letter-spacing:.12em;text-transform:uppercase;font-weight:700}
.cover .lead{margin:16px auto 0}
.chips{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin-top:24px}
.chip{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;background:#fff;border:1px solid var(--line);border-radius:999px;padding:8px 14px}
.chip b{color:var(--green)}
.dark .chip{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.18);color:#eaf6df}.dark .chip b{color:#9be25f}

.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:26px}
@media(max-width:860px){.g3{grid-template-columns:1fr 1fr}}
@media(max-width:560px){.g3{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}
.card .num{font-size:13px;font-weight:800;color:var(--tx3)}
.card h3{font-size:16px;font-weight:700;margin:2px 0 5px}
.card p{font-size:13.5px;color:var(--tx2)}

.arch{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:center;margin-top:24px}
.node{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 18px;text-align:center;min-width:150px}
.node b{display:block;font-size:14.5px}.node span{font-size:12px;color:var(--tx3)}
.arrow{color:var(--green);font-size:22px;font-weight:800}
.badges{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin-top:22px}
.badge{font-size:13px;font-weight:600;background:#fff;border:1px solid var(--line);border-radius:9px;padding:8px 13px}
.road{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:24px}
@media(max-width:720px){.road{grid-template-columns:1fr}}
.step{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:13px;padding:13px 16px}
.step .dot{flex:none;width:24px;height:24px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:800}
.step.next .dot{background:#e2e8e0;color:var(--tx2)}
.step b{font-size:14.5px}.step span{display:block;font-size:12.5px;color:var(--tx3)}

/* chrome */
.prog{position:fixed;top:0;left:0;height:3px;background:var(--green);width:0;z-index:30;transition:width .25s}
.dots{position:fixed;right:18px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:10px;z-index:30}
html[dir="rtl"] .dots{right:auto;left:18px}
.dots button{width:9px;height:9px;border-radius:50%;border:0;background:#cfd8cc;cursor:pointer;padding:0;transition:transform .2s,background .2s}
.dots button.on{background:var(--green);transform:scale(1.4)}
.counter{position:fixed;right:20px;bottom:16px;font-size:12px;font-weight:700;color:var(--tx3);letter-spacing:.06em;z-index:30}
html[dir="rtl"] .counter{right:auto;left:20px}

/* language switcher */
.langbar{position:fixed;top:14px;right:16px;z-index:40;display:flex;gap:4px;background:rgba(255,255,255,.86);
  backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:999px;padding:4px;box-shadow:0 8px 26px -12px rgba(2,44,22,.35)}
html[dir="rtl"] .langbar{right:auto;left:16px}
.dark-context .langbar{background:rgba(10,20,8,.7);border-color:rgba(255,255,255,.15)}
.langbar button{border:0;background:transparent;cursor:pointer;font-size:18px;line-height:1;padding:6px 8px;border-radius:999px;
  filter:grayscale(.6) opacity(.7);transition:filter .2s,background .2s}
.langbar button:hover{filter:none}
.langbar button.on{filter:none;background:var(--tint)}
@media(max-width:640px){.dots,.counter{display:none}}

.slide .r{opacity:0;transform:translateY(18px);transition:opacity .6s ease,transform .6s ease}
.slide.in .r{opacity:1;transform:none}
.slide.in .r:nth-child(2){transition-delay:.05s}.slide.in .r:nth-child(3){transition-delay:.1s}.slide.in .r:nth-child(4){transition-delay:.15s}
@media(prefers-reduced-motion:reduce){.slide .r{opacity:1;transform:none;transition:none}html{scroll-behavior:auto}}

.roles{display:grid;grid-template-columns:1fr 1fr;gap:clamp(14px,2vw,22px);margin-top:clamp(16px,2.6vw,26px)}
@media(max-width:760px){.roles{grid-template-columns:1fr}}
.rolecard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px}
.rolecard.admin{background:linear-gradient(160deg,#0e2e08,#163f0d);border-color:#1e5e12;color:#eaf6df}
.rolehead{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.roleic{width:44px;height:44px;border-radius:12px;background:var(--tint);color:var(--green);display:grid;place-items:center;flex:none}
.rolecard.admin .roleic{background:rgba(255,255,255,.12);color:#9be25f}
.roleic svg{width:23px;height:23px}
.rolehead b{display:block;font-size:17px;font-weight:800}
.rolehead .rt{font-size:12px;color:var(--tx3);line-height:1.35}
.rolecard.admin .rolehead .rt{color:#9db9a0}
.rolelist{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px}
.rolelist li{padding-left:20px;position:relative;font-size:13px}
.rolelist li::before{content:"✓";position:absolute;left:0;top:1px;color:var(--green);font-weight:800;font-size:11px}
.rolecard.admin .rolelist li::before{color:#9be25f}
html[dir="rtl"] .rolelist li{padding-left:0;padding-right:20px}
html[dir="rtl"] .rolelist li::before{left:auto;right:0}
.rolelist li b{font-weight:700}
.rolelist li span{color:var(--tx3);font-size:12px}
.rolecard.admin .rolelist li span{color:#94b697}
.rolenote{text-align:center;margin-top:18px;font-size:12.5px;color:var(--tx3)}

.flow{display:flex;flex-wrap:wrap;align-items:stretch;justify-content:center;gap:10px;margin-top:clamp(20px,3vw,32px)}
.fnode{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:16px 14px;width:180px;text-align:center}
.fnode .fi{width:44px;height:44px;border-radius:12px;background:var(--tint);color:var(--green);display:grid;place-items:center;margin:0 auto 10px}
.fnode .fi svg{width:23px;height:23px}
.fnode b{display:block;font-size:14.5px;font-weight:800}
.fnode span{font-size:11.5px;color:var(--tx3);line-height:1.35;display:block;margin-top:3px}
.farrow{align-self:center;color:var(--green);font-size:22px;font-weight:800}
html[dir="rtl"] .farrow{transform:scaleX(-1)}
.flownote{text-align:center;margin-top:22px;font-size:13px;color:var(--tx3)}
.cmp{margin-top:clamp(18px,3vw,28px);border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--card)}
.cmprow{display:grid;grid-template-columns:1.15fr 1fr 1fr;align-items:center}
.cmprow+.cmprow{border-top:1px solid var(--line)}
.cmprow>div{padding:13px 16px;font-size:13.5px}
.cmphead{background:var(--bg)}
.cmphead>div{font-weight:800;font-size:13px;letter-spacing:.02em}
.cmphead .cc{color:var(--green)}
.cmprow .asp{font-weight:700}
.cmprow .man{color:var(--tx2)}
.cmprow .man::before{content:"✕ ";color:#c2410c;font-weight:800}
.cmprow .ct{color:var(--tx);font-weight:600}
.cmprow .ct::before{content:"✓ ";color:var(--green);font-weight:800}
.cmphead .man::before,.cmphead .ct::before{content:""}
@media(max-width:640px){.cmprow>div{padding:10px 11px;font-size:12px}}

.demo{display:flex;gap:clamp(24px,5vw,64px);align-items:center;justify-content:center;flex-wrap:wrap;margin-top:clamp(18px,3vw,30px)}
.demophone{width:clamp(184px,20vw,236px)}
.demophone .frame{padding:6px;border-radius:36px;background:linear-gradient(155deg,#27313f,#0b1220);box-shadow:0 34px 60px -30px rgba(2,44,22,.5),inset 0 0 0 1px rgba(255,255,255,.06)}
.demophone .frame img{width:100%;display:block;border-radius:30px;aspect-ratio:412/892;object-fit:cover;background:#fff;transition:opacity .32s ease}
.demoinfo{max-width:330px}
html[dir="rtl"] .demoinfo{text-align:right}
.demoinfo .democap{font-size:clamp(22px,3vw,30px);font-weight:900;letter-spacing:-.02em;min-height:1.2em}
.demodots{display:flex;gap:6px;margin-top:14px}
html[dir="rtl"] .demodots{justify-content:flex-end}
.demodots i{width:7px;height:7px;border-radius:50%;background:var(--line);transition:.3s}
.demodots i.on{background:var(--green);width:22px;border-radius:4px}
</style>
</head>
<body>
<div class="prog" id="prog"></div>
<div class="langbar" id="langbar"></div>
<div class="dots" id="dots"></div>
<div class="counter" id="counter"></div>

<!-- 1 COVER -->
<section class="slide cover">
  <div class="wrap">
    <img class="logo r" src="img/qubah-full.png" alt="Qubah Group">
    <h1 class="r">CoalTrack</h1>
    <div class="by r" data-i18n="badge"></div>
    <p class="lead r" data-i18n="lead"></p>
    <div class="chips r">
      <span class="chip">🛡️ <b data-i18n="chip1"></b></span>
      <span class="chip">🙂 <b data-i18n="chip2"></b></span>
      <span class="chip">📍 <b data-i18n="chip3"></b></span>
      <span class="chip">✅ <b data-i18n="chip4"></b></span>
    </div>
  </div>
</section>

<!-- ROLES -->
<section class="slide">
  <div class="wrap">
    <span class="eyebrow r" data-i18n="rolEye"></span>
    <h2 class="r" data-i18n="rolTtl"></h2>
    <p class="lead r" data-i18n="rolLead"></p>
    <div class="roles r">
      <div class="rolecard">
        <div class="rolehead"><span class="roleic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span><div><b data-i18n="rolEmpN"></b><span class="rt" data-i18n="rolEmpT"></span></div></div>
        <ul class="rolelist"><li><b data-i18n="reAt"></b> <span data-i18n="reAd"></span></li><li><b data-i18n="reBt"></b> <span data-i18n="reBd"></span></li><li><b data-i18n="reCt"></b> <span data-i18n="reCd"></span></li><li><b data-i18n="reDt"></b> <span data-i18n="reDd"></span></li><li><b data-i18n="reEt"></b> <span data-i18n="reEd"></span></li><li><b data-i18n="reFt"></b> <span data-i18n="reFd"></span></li></ul>
      </div>
      <div class="rolecard admin">
        <div class="rolehead"><span class="roleic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg></span><div><b data-i18n="rolAdmN"></b><span class="rt" data-i18n="rolAdmT"></span></div></div>
        <ul class="rolelist"><li><b data-i18n="raAt"></b> <span data-i18n="raAd"></span></li><li><b data-i18n="raBt"></b> <span data-i18n="raBd"></span></li><li><b data-i18n="raCt"></b> <span data-i18n="raCd"></span></li><li><b data-i18n="raDt"></b> <span data-i18n="raDd"></span></li><li><b data-i18n="raEt"></b> <span data-i18n="raEd"></span></li><li><b data-i18n="raFt"></b> <span data-i18n="raFd"></span></li></ul>
      </div>
    </div>
    <p class="rolenote r" data-i18n="rolNote"></p>
  </div>
</section>

<!-- 2 EMPLOYEE -->
<section class="slide">
  <div class="wrap">
    <span class="eyebrow r" data-i18n="s2eye"></span>
    <h2 class="r" data-i18n="s2ttl"></h2>
    <div class="phones r">
      <div class="phone"><div class="frame"><img data-shot="emp-home" src="img/emp-home.en.png" alt=""></div><div class="cap"><b data-i18n="cHome"></b></div></div>
      <div class="phone"><div class="frame"><img data-shot="emp-absen" src="img/emp-absen.en.png" alt=""></div><div class="cap"><b data-i18n="cAbsen"></b></div></div>
      <div class="phone"><div class="frame"><img data-shot="emp-riwayat" src="img/emp-riwayat.en.png" alt=""></div><div class="cap"><b data-i18n="cHist"></b></div></div>
      <div class="phone"><div class="frame"><img data-shot="emp-profil" src="img/emp-profil.en.png" alt=""></div><div class="cap"><b data-i18n="cProfile"></b></div></div>
    </div>
  </div>
</section>

<!-- SECURITY -->
<section class="slide">
  <div class="wrap">
    <span class="eyebrow r" data-i18n="secEye"></span>
    <h2 class="r" data-i18n="secTtl"></h2>
    <p class="lead r" data-i18n="secLead"></p>
    <div class="phones r">
      <div class="phone"><div class="frame"><img data-shot="sec-login" src="img/sec-login.en.png" alt=""></div><div class="cap"><b data-i18n="cLogin"></b></div></div>
      <div class="phone"><div class="frame"><img data-shot="sec-lock" src="img/sec-lock.en.png" alt=""></div><div class="cap"><b data-i18n="cLock"></b></div></div>
      <div class="phone"><div class="frame"><img data-shot="sec-setup" src="img/sec-setup.en.png" alt=""></div><div class="cap"><b data-i18n="cSetup"></b></div></div>
    </div>
  </div>
</section>

<!-- LIVE DEMO -->
<section class="slide">
  <div class="wrap" style="text-align:center">
    <span class="eyebrow r" data-i18n="demoEye" style="justify-content:center"></span>
    <h2 class="r" data-i18n="demoTtl"></h2>
    <div class="demo r">
      <div class="demophone"><div class="frame"><img id="demoimg" src="img/emp-home.en.png" alt=""></div></div>
      <div class="demoinfo">
        <div class="democap" id="democap"></div>
        <div class="demodots" id="demodots"></div>
        <p class="lead" data-i18n="demoLead" style="margin-top:14px;font-size:15px"></p>
      </div>
    </div>
  </div>
</section>

<!-- 3 MORE -->
<section class="slide">
  <div class="wrap">
    <span class="eyebrow r" data-i18n="s3eye"></span>
    <h2 class="r" data-i18n="s3ttl"></h2>
    <div class="phones r">
      <div class="phone"><div class="frame"><img data-shot="leave" src="img/leave.en.png" alt=""></div><div class="cap"><b data-i18n="cLeave"></b></div></div>
      <div class="phone"><div class="frame"><img data-shot="notif" src="img/notif.en.png" alt=""></div><div class="cap"><b data-i18n="cNotif"></b></div></div>
      <div class="phone"><div class="frame"><img data-shot="edit-profile" src="img/edit-profile.en.png" alt=""></div><div class="cap"><b data-i18n="cEdit"></b></div></div>
    </div>
  </div>
</section>

<!-- 4 PAYSLIP -->
<section class="slide">
  <div class="wrap">
    <span class="eyebrow r" data-i18n="s4eye"></span>
    <h2 class="r" data-i18n="s4ttl"></h2>
    <p class="lead r" data-i18n="s4lead"></p>
    <div class="phones r">
      <div class="phone"><div class="frame"><img data-shot="emp-gaji" src="img/emp-gaji.en.png" alt=""></div><div class="cap"><b data-i18n="cPay"></b></div></div>
      <div class="phone"><div class="frame"><img data-shot="emp-slip" src="img/emp-slip.en.png" alt=""></div><div class="cap"><b data-i18n="cSlip"></b></div></div>
      <div class="phone"><div class="frame"><img data-shot="slip-dark" src="img/slip-dark.en.png" alt=""></div><div class="cap"><b data-i18n="cSlipDark"></b></div></div>
    </div>
  </div>
</section>

<!-- 5 DARK MODE -->
<section class="slide dark">
  <div class="wrap">
    <span class="eyebrow r" data-i18n="s5eye"></span>
    <h2 class="r" data-i18n="s5ttl"></h2>
    <p class="lead r" data-i18n="s5lead"></p>
    <div class="phones r">
      <div class="phone"><div class="frame"><img data-shot="home-dark" src="img/home-dark.en.png" alt=""></div><div class="cap"><b data-i18n="cHome"></b></div></div>

window.__ctI18N=I18N;
function setLang(code){
  const dict=I18N[code]||I18N.en;
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const v=dict[el.getAttribute('data-i18n')];
    if(v!=null) el.textContent=v;
  });
  document.querySelectorAll('img[data-shot]').forEach(img=>{
    img.src='img/'+img.getAttribute('data-shot')+'.'+code+'.png';
  });
  const root=document.documentElement;
  root.lang=code;
  root.dir = code==='ar' ? 'rtl' : 'ltr';
  document.querySelectorAll('#langbar button').forEach(b=>b.classList.toggle('on',b.dataset.l===code));
  try{localStorage.setItem('ct_lang',code)}catch(e){}
}

(function(){
  const bar=document.getElementById('langbar');
  LANGS.forEach(([code,flag])=>{
    const b=document.createElement('button');
    b.textContent=flag; b.dataset.l=code; b.title=code.toUpperCase();
    b.addEventListener('click',()=>setLang(code));
    bar.appendChild(b);
  });
  let start='en';
  try{const s=localStorage.getItem('ct_lang'); if(s&&I18N[s])start=s;}catch(e){}
  setLang(start);

  // nav dots + progress + reveal
  const slides=[].slice.call(document.querySelectorAll('.slide'));
  const dotsWrap=document.getElementById('dots'), counter=document.getElementById('counter'), prog=document.getElementById('prog');
  const N=slides.length, pad=n=>(n<10?'0':'')+n;
  slides.forEach((s,i)=>{const b=document.createElement('button');b.setAttribute('aria-label','Slide '+(i+1));
    b.addEventListener('click',()=>slides[i].scrollIntoView());dotsWrap.appendChild(b);});
  const dots=dotsWrap.children;
  let cur=0;
  const io=new IntersectionObserver(es=>{es.forEach(e=>{const i=slides.indexOf(e.target);
    if(e.isIntersecting){e.target.classList.add('in');
      document.body.classList.toggle('dark-context', e.target.classList.contains('dark'));
      if(e.intersectionRatio>=.55){cur=i;for(let j=0;j<N;j++)dots[j].className=(j===i?'on':'');
        counter.textContent=pad(i+1)+' / '+pad(N);prog.style.width=((i+1)/N*100)+'%';}}});},{threshold:[.55]});
  slides.forEach(s=>io.observe(s));
  function go(d){const t=Math.max(0,Math.min(N-1,cur+d));slides[t].scrollIntoView();}
  window.addEventListener('keydown',e=>{
    if(['ArrowDown','ArrowRight',' ','PageDown'].indexOf(e.key)>=0){e.preventDefault();go(1);}
    else if(['ArrowUp','ArrowLeft','PageUp'].indexOf(e.key)>=0){e.preventDefault();go(-1);}
    else if(e.key==='Home'){e.preventDefault();slides[0].scrollIntoView();}
    else if(e.key==='End'){e.preventDefault();slides[N-1].scrollIntoView();}
  });
})();
</script>
<script>
(function(){
  var seq=[["emp-home","cHome"],["emp-absen","cAbsen"],["emp-riwayat","cHist"],["emp-gaji","cPay"],["emp-profil","cProfile"]];
  var img=document.getElementById("demoimg"),cap=document.getElementById("democap"),dotsEl=document.getElementById("demodots");
  if(!img) return;
  seq.forEach(function(){dotsEl.appendChild(document.createElement("i"));});
  var dots=dotsEl.children,idx=0;
  function lang(){return document.documentElement.lang||"en";}
  function tr(k){var d=window.__ctI18N&&window.__ctI18N[lang()];return (d&&d[k])||k;}
  function show(i){var sc=seq[i];img.style.opacity=0;
    setTimeout(function(){img.src="img/"+sc[0]+"."+lang()+".png";cap.textContent=tr(sc[1]);img.style.opacity=1;},260);
    for(var j=0;j<dots.length;j++)dots[j].className=(j===i?"on":"");}
  show(0);
  setInterval(function(){idx=(idx+1)%seq.length;show(idx);},2400);
})();
</script>
